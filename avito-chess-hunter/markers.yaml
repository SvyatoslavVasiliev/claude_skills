# Диагностические маркеры шахматных наборов для vision-прохода.
#
# ПРИНЦИП: модель отвечает только на вопросы о наблюдаемой геометрии
# ("сколько колец под короной?"), а сопоставление с моделью делает
# детерминированный код в score.py. Модель НЕ решает "это ценный набор".
#
# confidence:
#   grounded  — подтверждено источником, ссылка в source
#   memory    — из общих знаний, НЕ перепроверено, требует сверки
#
# Главный дефицит: sovietchesssets.com (основной каталог) и barnebys
# (realized prices) недоступны из рабочей среды. Всё, что помечено
# memory, нужно сверить по ним перед тем, как тратить деньги.

models:

  - id: berezovsky_1930s
    name: "Берёзовский / «мордовский» тип, довоенный (1930-е)"
    era: "1930-е"
    why: >
      Приз всего советского сегмента. Массово известен послевоенный
      клон из лагерей Темникова и Яваса — он дёшев и обычен. Довоенный
      оригинал внешне похож, поэтому его регулярно продают как «обычные
      старые шахматы СССР». Это лучший кандидат в hidden gem: разрыв
      между ценой незнающего продавца и ценой у коллекционера максимален
      именно потому, что различие тонкое.
    confidence: grounded
    source: "sovietchesssets.com — The Gulag Sets of Mordovia (через поисковый сниппет)"
    photo_markers:          # что должно быть ИСТИНОЙ для довоенного
      collars_under_crown: 3          # у короля и ферзя три кольца между короной и стеблем
      collars_under_mitre: 3          # у слона три кольца между митрой и стеблем
      knight_chest: straight          # грудь коня прямая
      weighted: true                  # довоенные утяжелены
      king_height_cm: [10.0, 10.4]    # ~10.2 см
    postwar_clone_markers:  # что означает обычный послевоенный (дёшево)
      collars_under_crown: 1          # одиночный дисковидный пьедестал
      knight_chest: v_shaped          # грудь коня V-образная
      weighted: false                 # без утяжеления, устойчивость за счёт
      base_profile: wide_conical      # широкого конического стебля и основания
    ask_seller:
      - "Фото короля и ферзя сбоку крупно — нужно сосчитать кольца под короной"
      - "Фото коня строго в профиль"
      - "Переверните короля: есть ли грузик/свинец в основании, чем заклеено дно"
      - "Высота короля линейкой, приложенной рядом"

  - id: lfz_krasnye_belye
    name: "«Красные и белые», агитационный фарфор, Н. Я. Данько, ГФЗ–ЛФЗ"
    era: "1922–1923 и последующие тиражи"
    why: >
      Самая известная советская шахматная вещь; оригинал в Эрмитаже.
      Ловушка двусторонняя: ИФЗ сегодня продаёт современную реплику за
      456 920 ₽, тогда как отдельные предметы периода на антикварном
      рынке котируются от ~110 000 ₽. То есть на Avito встречается и
      недооценённый период, и переоценённая реплика, выдаваемая за
      период. Решает ТОЛЬКО клеймо на донышке.
    confidence: grounded
    source: "ipm.ru (реплика 456 920 ₽); dvaveka.ru (предметы периода); chessm.ru"
    photo_markers:
      material: porcelain
      painted: hand_painted
      base_mark_visible: true
    decisive_evidence: "Клеймо на донышке фигуры — ГФЗ (серп и молот, 1921–1925) / ЛФЗ / современное ИФЗ"
    ask_seller:
      - "Макро-фото клейма на донышке, минимум трёх разных фигур"
      - "Есть ли сертификат / паспорт набора"
      - "Полный ли комплект (32 фигуры), какие сколы и реставрации"

  - id: jaques_staunton
    name: "Jaques of London, Staunton"
    era: "с сентября 1849"
    why: >
      Попадает в РФ через наследства и «привезли из Германии/Англии».
      Российский частный продавец клеймо обычно не опознаёт. Дилерский
      ask в Британии за 1880–1915 — £1 250–1 500.
    confidence: grounded
    source: "chessantiques.com; antiquechessshop.com; chess.com forum"
    photo_markers:
      king_base_stamp: "JAQUES LONDON"
      crown_stamp_on: [kingside_rook, kingside_knight]
      baize: coarse_wool          # грубое шерстяное сукно, не современное бильярдное
    disqualifiers:
      - "Заявленная дата ранее сентября 1849 — Jaques до этого наборы не выпускал"
      - "Гладкое современное бильярдное сукно вместо грубого байкового"
    ask_seller:
      - "Фото донышка белого короля крупно (клеймо)"
      - "Фото донышек королевской ладьи и коня (коронные клейма)"
      - "Фото сукна на донышке под углом — видна фактура"
      - "Фото коробки/футляра снаружи и этикетки внутри крышки"

  - id: baku_drevprom
    name: "«Баку», артель «Древпром», Ленинградская область"
    era: "1950–60-е"
    why: "Именованный узнаваемый паттерн, документирован у коллекционеров; на Avito идёт как безымянные «шахматы СССР»."
    confidence: grounded
    source: "sovietchesssets.com — Baku Pieces from Leningrad Region's Artel Drevprom (сниппет)"
    photo_markers: {}       # ЗАГЛУШКА: геометрию не удалось получить, сайт заблокирован
    gap: "Нужно вытащить признаки с sovietchesssets.com — из этой среды недоступен"
    ask_seller:
      - "Фото всех фигур в ряд на однотонном фоне"
      - "Фото коробки и любых наклеек/штампов на ней"

  - id: selenus_bone
    name: "Selenus (немецкий/североевропейский костяной), XIX в."
    era: "XIX в."
    why: "Уходил на Bonhams; в РФ встречается как «старые костяные шахматы». Высокие ярусные фигуры с растительным декором, в Англии звались 'tulip'."
    confidence: grounded
    source: "Bonhams lot 181, auction 16794; chessstrategyonline.com"
    photo_markers:
      material: bone
      silhouette: tall_tiered_finial
    ask_seller:
      - "Макро текстуры кости на сломе/донышке (линии Шрегера отличают слона от кости/пластика)"
      - "Фото самой высокой фигуры с линейкой"

  - id: english_turned_patterns
    name: "Английские токарные паттерны: Lund, Calvert, St George, Merrifield"
    era: "конец XVIII — сер. XIX в."
    why: "Гравированные (engine-turned) варианты значительно реже и высоко ценятся коллекционерами."
    confidence: grounded
    source: "chessstrategyonline.com; chessantiquesonline.com"
    photo_markers:
      turning_decoration: engine_turned   # признак редкой версии
    ask_seller:
      - "Крупно фото стебля короля — есть ли машинная гравировка по телу"

  - id: kholmogory_bone
    name: "Холмогорская резная кость (Архангельская обл.)"
    era: "XVIII–XX вв."
    why: "Промысел 400+ лет, пик в XVIII в. Русский, а значит ходит именно по внутреннему рынку — релевантен для покупки в РФ."
    confidence: memory
    source: "cultnord.ru, holmogory.com — общая справка; ЦЕН НЕ НАЙДЕНО"
    gap: "Нет ни одной подтверждённой реализованной цены. Не покупать по этой строке без отдельной оценки."
    photo_markers:
      material: bone
      carving: openwork_relief
    ask_seller:
      - "Макро резьбы и макро донышка"

  - id: shah_boy_gzhel
    name: "«Шах-бой», агитационные шахматы, Гжель, А. С. Юргелевич"
    era: "1930-е"
    why: >
      Та же логика, что у Данько, но известность сильно ниже — значит и
      шанс встретить неопознанным выше. Агитационный сюжет: две идеологии
      друг против друга, у капиталистической стороны король-скелет и
      закабалённые воины, ферзь сыплет золото из рога изобилия. Такой
      набор невозможно спутать с бытовым, но легко продать как
      «фарфоровые фигурки».
    confidence: grounded
    source: "dvaveka.ru — агитационные советские шахматы, Гжель, 1930-е, Юргелевич А. С."
    photo_markers:
      material: porcelain
      figurative: ideological_allegory
    ask_seller:
      - "Макро клейма на донышке нескольких фигур"
      - "Фото короля «капиталистической» стороны крупно (скелет?)"
      - "Полный ли комплект, какие сколы"

  - id: zveri_severa_yuga
    name: "«Звери Севера и Юга», ЛФЗ, З. О. Кульбах"
    era: "1930–1940-е"
    why: >
      Фарфор с росписью и золочением, высота фигур около 8 см. Шёл и на
      внутренний рынок, и на экспорт. Зоологический сюжет вместо
      идеологического, поэтому продавец чаще принимает его за детский
      сувенир, а не за ЛФЗ периода.
    confidence: grounded
    source: "dvaveka.ru — набор «Звери Севера и Юга»; скульптор З. О. Кульбах (1908–1997)"
    photo_markers:
      material: porcelain
      figurative: animals
      height_cm: [7.5, 8.5]
      gilding: present
    disqualifiers:
      - >
        ДОСКА К ЭТОМУ НАБОРУ НЕ ВЫПУСКАЛАСЬ. Комплект «с родной доской» —
        либо сборный, либо не он. Признак сильный и проверяется по фото.
    ask_seller:
      - "Макро клейма ЛФЗ на донышке"
      - "Высота фигуры с линейкой рядом"
      - "Откуда доска, если она есть"

  - id: kasli_iron
    name: "Каслинское чугунное литьё"
    era: "XIX — XX вв."
    why: >
      Уральский промысел с 1747 года, Челябинская область. Узнаваем по
      почти графической чёткости силуэта и особой чёрной краске. Русский,
      тяжёлый, дорогой в пересылке — значит ходит именно по внутреннему
      рынку и именно в регионах.
    confidence: memory
    source: "monetnik.ru, artantique.ru — общая справка по Касли; ЦЕН ПО ШАХМАТАМ НЕ НАЙДЕНО"
    gap: >
      Подтверждённых реализованных цен именно на каслинские ШАХМАТЫ нет,
      только на литьё вообще. Не покупать по этой строке без отдельной
      оценки.
    photo_markers:
      material: cast_iron
      finish: matte_black
    ask_seller:
      - "Есть ли клеймо завода и год на донышке"
      - "Вес комплекта"

# Общие признаки новодела / искусственного старения (дисквалификаторы).
# Применяются ко всем моделям.
repro_tells:
  confidence: grounded
  source: "chess.com — Fake Soviet Sets?; houseofstaunton — chess set collecting"
  visual:
    - "Набор выглядит «слишком хорошо»: ровный цвет, острые рёбра, нет микротрещин"
    - "Патина однородная по всем фигурам — настоящий износ всегда неравномерный (короли и кони трогали чаще пешек)"
    - "Глянцевый полиуретановый лак вместо матового старого покрытия"
    - "Новый ровный фетр одинаковой толщины на всех фигурах"
    - "Комплект идеально подобран, но коробка современная"
  textual:
    - "«турнирные» — почти всё, что так названо, это уличные репродукции, а не турнирные наборы"
    - "«состаренный», «под старину», «реплика», «в стиле»"
  note: >
    Патина сама по себе НЕ доказывает возраст — её делают. Работают
    неравномерность износа и конструктивные признаки, а не цвет.
