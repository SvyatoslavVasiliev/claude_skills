# Стратегия поиска.
#
# КОНТРИНТУИТИВНО: запросы вроде "антикварные шахматы" / "коллекционные
# шахматы" здесь почти бесполезны. Это самоотбор осведомлённых продавцов
# и дилеров — цена там уже рыночная. Нам нужны запросы, по которым
# постит человек, разбирающий квартиру.
#
# Поэтому список ниже намеренно "тупой".

search:
  base: "https://www.avito.ru"
  # Пустой location = вся Россия. Для самовывоза поставьте свой город.
  location: "all"
  # Глубокая пагинация ведёт к блокировке на 4-5 странице и собирает
  # наименее полезное (лоты уходят за часы, старые страницы мертвы).
  # Реально работает мелко-широкий обход: см. --pages-per-query в scrape.py,
  # по умолчанию 3. Значение ниже — только страховочный потолок.
  max_pages: 50
  sort: "date"          # свежие сверху: важно, лоты уходят за часы

  queries:
    # --- широкий захват, основная масса ---
    - "шахматы"
    - "шахматы деревянные"
    - "шахматы старые"
    - "шахматы СССР"
    - "шахматы советские"
    # --- материал: там, где сидит ценное ---
    - "шахматы кость"
    - "шахматы костяные"
    - "шахматы фарфор"
    - "шахматы фарфоровые"
    - "шахматы бронза"
    - "шахматы чугун"
    - "шахматы самшит"
    # --- язык расчистки наследства: самый сильный сигнал ---
    - "шахматы дедушкины"
    - "шахматы с дачи"
    - "шахматы из квартиры"
    - "шахматы довоенные"
    - "шахматы трофейные"
    # --- контрольная группа: осведомлённые продавцы.
    #     Собираем НЕ чтобы покупать, а чтобы калибровать ценовой потолок
    #     и учить фильтр отличать дилера от частника.
    - "шахматы антикварные"
    - "шахматы коллекционные"

# Категории Avito. Один и тот же лот часто лежит не там, где ждёшь:
# старые шахматы регулярно постят в "Для дома и дачи", а не в
# "Коллекционирование". Поэтому ходим по всем.
categories:
  - "kollektsionirovanie"
  - "igry_pristavki_i_programmy"
  - "dlya_doma_i_dachi"
  - "lichnye_veschi"
  - ""            # без категории — общий поиск
